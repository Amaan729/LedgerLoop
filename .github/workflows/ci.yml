name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ledgerloop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: tests (sqlite)
        run: pytest -q
      - name: tests (postgres)
        run: pytest -q
        env:
          LEDGERLOOP_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost/ledgerloop_test
      - name: small benchmark smoke run
        run: python scripts/bench.py --customers 150 --days 60 --out /tmp/bench
        env:
          LEDGERLOOP_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost/ledgerloop_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
