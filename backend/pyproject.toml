[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerloop"
version = "0.1.0"
description = "Agentic order-to-cash over an append-only event log"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
llm = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
include = ["ledgerloop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
